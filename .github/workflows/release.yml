name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome extension
        run: bash extensions/chrome/package.sh

      - name: Package VS Code extension
        run: |
          npm install -g @vscode/vsce
          bash extensions/vscode/package.sh

      - name: Generate release notes
        id: notes
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## What's included"
            echo "- Chrome extension package"
            echo "- VS Code extension package"
            echo ""
            echo "## Verification"
            echo "- Built from tag ${GITHUB_REF_NAME}"
            echo "- CI and packaging workflow completed successfully"
          } > "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            extensions/chrome/varterm-tts-chrome.zip
            extensions/vscode/*.vsix
