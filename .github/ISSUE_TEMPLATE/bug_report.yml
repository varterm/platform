name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / version
      placeholder: Chrome 125, Safari 17.4, etc.

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 14, Windows 11, etc.

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: shell
