<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
    }
    
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #1a1a2e, #16162a);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo {
      font-size: 24px;
    }
    
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    
    .tagline {
      font-size: 11px;
      color: #888;
    }
    
    .content {
      padding: 16px;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    
    select, input[type="range"] {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
    }
    
    select:focus, input:focus {
      outline: none;
      border-color: #6366f1;
    }
    
    input[type="range"] {
      padding: 0;
      height: 6px;
      -webkit-appearance: none;
      background: #2a2a3e;
      border-radius: 3px;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
    }
    
    .rate-display {
      text-align: right;
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .checkbox-group input {
      width: 16px;
      height: 16px;
      accent-color: #6366f1;
    }
    
    .checkbox-group label {
      margin: 0;
      font-size: 13px;
      color: #e0e0e0;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    
    .btn-secondary {
      background: #2a2a3e;
      color: #e0e0e0;
    }
    
    .btn-secondary:hover {
      background: #3a3a4e;
    }
    
    .shortcuts {
      padding: 12px 16px;
      background: #1a1a2e;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .shortcut {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    
    .shortcut:last-child {
      margin-bottom: 0;
    }
    
    kbd {
      background: #2a2a3e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 10px;
    }
    
    .footer {
      padding: 12px 16px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .footer a {
      color: #6366f1;
      text-decoration: none;
      font-size: 12px;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    .status {
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    
    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔊</span>
    <div>
      <div class="title">Varterm TTS</div>
      <div class="tagline">Text to Speech for the Web</div>
    </div>
  </div>
  
  <div class="content">
    <div id="status" class="status"></div>
    
    <div class="section">
      <div class="section-title">Voice Settings</div>
      
      <div class="input-group">
        <label for="voiceTier">Voice Tier</label>
        <select id="voiceTier">
          <option value="cloud">Cloud (Microsoft Neural)</option>
          <option value="browser">Browser (Built-in)</option>
        </select>
      </div>
      
      <div class="input-group" id="voiceGroup">
        <label for="voice">Voice</label>
        <select id="voice">
          <option value="en-US-AriaNeural">Aria (US, Friendly)</option>
          <option value="en-US-JennyNeural">Jenny (US, Warm)</option>
          <option value="en-US-GuyNeural">Guy (US, Casual)</option>
          <option value="en-US-DavisNeural">Davis (US, Calm)</option>
          <option value="en-GB-SoniaNeural">Sonia (UK, Warm)</option>
          <option value="en-GB-RyanNeural">Ryan (UK, Professional)</option>
          <option value="en-AU-NatashaNeural">Natasha (AU, Friendly)</option>
        </select>
      </div>
      
      <div class="input-group">
        <label for="rate">Speed</label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        <div class="rate-display"><span id="rateValue">1.0</span>x</div>
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="stripMarkdown" checked>
        <label for="stripMarkdown">Strip markdown formatting</label>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn-primary" id="readSelection">▶ Read Selection</button>
      <button class="btn-secondary" id="stop">⏹ Stop</button>
    </div>
  </div>
  
  <div class="shortcuts">
    <div class="shortcut">
      <span>Read selection</span>
      <kbd>Ctrl+Shift+R</kbd>
    </div>
    <div class="shortcut">
      <span>Stop speaking</span>
      <kbd>Ctrl+Shift+S</kbd>
    </div>
  </div>
  
  <div class="footer">
    <a href="https://varterm.com" target="_blank">Open Varterm Web App →</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
